<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEXUS — Игра</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #3a5a7a; font-family: Verdana, Tahoma, Arial, sans-serif; font-size: 11px; color: #222; overflow: hidden; }
        header { background: linear-gradient(#0d2c54, #1a4f8a 50%, #0d2c54); border-bottom: 2px solid #000; color: #fff; padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; height: 40px; }
        .logo { font-family: "Arial Black", Impact, sans-serif; font-size: 18px; letter-spacing: 2px; text-shadow: 2px 2px 0 #000; }
        .logo span { color: #ffcc00; }
        
        .game-container { display: flex; height: calc(100vh - 65px); padding: 10px; gap: 10px; background: #d8e0e8; }
        .sidebar { width: 200px; background: #fff; border: 2px solid #0a1c33; display: flex; flex-direction: column; }
        .sidebar h3 { background: linear-gradient(#4a7ab0, #2c5686); color: #fff; padding: 4px; font-size: 11px; border-bottom: 1px solid #0a1c33; text-align: center; flex-shrink: 0; }
        .sidebar-content { padding: 8px; line-height: 1.6; }
        .canvas-wrapper { flex: 1; border: 2px solid #0a1c33; background: #87CEEB; position: relative; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* Голосовой чат */
        .voice-btn { background: #555; color: white; border: 1px solid #000; padding: 4px; font-weight: bold; cursor: pointer; margin-bottom: 5px; width: 100%; }
        .voice-btn.active { background: #4caf50; }

        .chat-container { display: flex; flex-direction: column; height: 100%; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 6px; background: #fff; line-height: 1.4; }
        .chat-input-area { display: flex; border-top: 1px solid #0a1c33; background: #eef3f7; flex-shrink: 0; }
        .chat-input-area input { flex: 1; border: none; padding: 6px; outline: none; }
        .chat-input-area input:disabled { background: #ccc; cursor: not-allowed; }
        .chat-input-area button { background: linear-gradient(#4a7ab0, #2c5686); color: #fff; border: none; padding: 0 12px; cursor: pointer; font-weight: bold; }
        .chat-input-area button:disabled { background: #888; cursor: not-allowed; }

        /* ЭКРАН ЗАГРУЗКИ */
        #loadingScreen {
            position: fixed; inset: 0; background: rgba(255, 255, 255, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; font-size: 16px; font-weight: bold; color: #0a1c33;
            pointer-events: auto; /* Блокирует клики */
        }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #4a7ab0; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* МЕНЮ ПАУЗЫ */
        #pauseMenu {
            position: absolute; inset: 0; background: rgba(10, 28, 51, 0.8);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 60;
        }
        .pause-box { background: #fff; border: 2px solid #0a1c33; padding: 20px; text-align: center; width: 250px; }
        .pause-box h2 { margin-top: 0; color: #0a1c33; }
        .pause-box button { width: 100%; padding: 8px; margin-bottom: 10px; font-weight: bold; cursor: pointer; border: 1px solid #000; font-family: Verdana, sans-serif; font-size: 12px; }
        .btn-resume { background: #4caf50; color: white; }
        .btn-exit { background: #f44336; color: white; }
        
        .menu-btn { position: absolute; top: 10px; right: 10px; background: #f44336; color: white; border: 2px solid #fff; border-radius: 4px; padding: 5px 10px; font-weight: bold; cursor: pointer; z-index: 40; }
    </style>
</head>
<body>

    <header>
        <div class="logo">NEXUS<span>.</span></div>
        <div class="user-info">Игрок: Builder2006</div>
    </header>

    <div class="game-container">
        <div class="sidebar">
            <h3>Здоровье</h3>
            <div class="sidebar-content" style="color: #cc0000; font-weight: bold;">HP: 100 / 100</div>
            <h3>Голосовой чат</h3>
            <div class="sidebar-content">
                <button id="voiceBtn" class="voice-btn" onclick="toggleVoice()">🎤 Включить микрофон</button>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            
            <button class="menu-btn" onclick="togglePause()">⏸ МЕНЮ</button>

            <!-- Меню паузы -->
            <div id="pauseMenu">
                <div class="pause-box">
                    <h2>Пауза</h2>
                    <button class="btn-resume" onclick="togglePause()">Продолжить</button>
                    <button class="btn-exit" onclick="exitGame()">Выйти из игры</button>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <h3>Чат</h3>
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <div>[Система]: Ожидание...</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Введите текст..." maxlength="50" disabled>
                    <button id="chat-send-btn" onclick="sendMessage()" disabled>Отпр</button>
                </div>
            </div>
        </div>
    </div>

    <div id="loadingScreen">
        <div class="spinner"></div>
        Подключение к серверу...
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.querySelector('.canvas-wrapper');
    const loadingScreen = document.getElementById('loadingScreen');
    const pauseMenu = document.getElementById('pauseMenu');
    const chatInput = document.getElementById('chat-input');
    const chatSendBtn = document.getElementById('chat-send-btn');

    let isPaused = false;
    let isGameReady = false;

    function resize() {
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const TILE_WIDTH = 64;
    const TILE_HEIGHT = 32;

    const player = { x: 0, y: 0, speed: 0.08, facing: 'down' };
    let isMoving = false;
    let otherPlayers = {};
    let globalTick = 0;
    let lastSentX = 0, lastSentY = 0, lastSentFacing = 'down';

    const trees = [
        { x: 2, y: 1 }, { x: -2, y: -1 }, { x: 3, y: -2 }, { x: -1, y: 2 }, { x: 1, y: 3 }
    ];

    const keys = {};
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Escape') { togglePause(); return; }
        if (e.target.tagName === 'INPUT' || !isGameReady) return; 
        keys[e.code] = true; 
        if(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
        if (e.target.tagName === 'INPUT') return;
        keys[e.code] = false;
    });

    let cameraStep = 0; 
    let cameraAngle = 0;

    function toIso(x, y) {
        const cos = Math.cos(cameraAngle);
        const sin = Math.sin(cameraAngle);
        const rotX = x * cos - y * sin;
        const rotY = x * sin + y * cos;
        return { x: (rotX - rotY) * (TILE_WIDTH / 2), y: (rotX + rotY) * (TILE_HEIGHT / 2) };
    }

    // --- СЕТЬ ---
    const ws = new WebSocket('ws://localhost:8765');
    const chatMessages = document.getElementById('chat-messages');

    ws.onopen = () => {
        addChatMessage('[Система]: Соединение установлено. Синхронизация...');
    };

    ws.onclose = () => {
        addChatMessage('[Система]: Сервер выключен.');
        loadingScreen.innerHTML = 'Сервер недоступен.';
        loadingScreen.style.display = 'flex';
        isGameReady = false;
    };
    
    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        
        if (msg.type === 'init') {
            otherPlayers = msg.players || {};
            loadingScreen.style.display = 'none'; 
            isGameReady = true;
            chatInput.disabled = false;
            chatSendBtn.disabled = false;
            addChatMessage('[Система]: Вы в игре!');
        } 
        else if (msg.type === 'update') {
            otherPlayers[msg.id] = msg.data;
        } 
        else if (msg.type === 'disconnect') {
            delete otherPlayers[msg.id];
        }
        else if (msg.type === 'voice-offer') {
            handleVoiceOffer(msg.id, msg.offer);
        }
        else if (msg.type === 'voice-answer') {
            handleVoiceAnswer(msg.id, msg.answer);
        }
        else if (msg.type === 'voice-ice') {
            handleVoiceIce(msg.id, msg.candidate);
        }
    };

    setInterval(() => {
        if (!isGameReady || isPaused || ws.readyState !== WebSocket.OPEN) return;
        if (Math.abs(player.x - lastSentX) > 0.01 || Math.abs(player.y - lastSentY) > 0.01 || player.facing !== lastSentFacing) {
            ws.send(JSON.stringify({ x: player.x, y: player.y, facing: player.facing, moving: isMoving }));
            lastSentX = player.x;
            lastSentY = player.y;
            lastSentFacing = player.facing;
        }
    }, 50);

    // ==========================================
    // ГОЛОСОВОЙ ЧАТ (WebRTC)
    // ==========================================
    let localStream = null;
    let isVoiceActive = false;
    const peerConnections = {};
    const audioElements = {};
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    async function toggleVoice() {
        const btn = document.getElementById('voiceBtn');
        if (!isVoiceActive) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isVoiceActive = true;
                btn.textContent = '🔴 Выключить микрофон';
                btn.classList.add('active');
                
                for (let id in otherPlayers) {
                    createPeerConnection(id, true);
                }
            } catch (err) {
                alert('Не удалось получить доступ к микрофону: ' + err.message);
            }
        } else {
            isVoiceActive = false;
            btn.textContent = '🎤 Включить микрофон';
            btn.classList.remove('active');
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            for (let id in peerConnections) {
                peerConnections[id].close();
                delete peerConnections[id];
            }
            for (let id in audioElements) {
                audioElements[id].remove();
                delete audioElements[id];
            }
        }
    }

    function createPeerConnection(targetId, isInitiator) {
        if (peerConnections[targetId]) return peerConnections[targetId];
        
        const pc = new RTCPeerConnection(rtcConfig);
        peerConnections[targetId] = pc;

        if (localStream) {
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        }

        pc.onicecandidate = (event) => {
            if (event.candidate && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'voice-ice', target: targetId, candidate: event.candidate }));
            }
        };

        pc.ontrack = (event) => {
            if (!audioElements[targetId]) {
                const audio = document.createElement('audio');
                audio.autoplay = true;
                document.body.appendChild(audio);
                audioElements[targetId] = audio;
            }
            audioElements[targetId].srcObject = event.streams[0];
        };

        if (isInitiator) {
            pc.createOffer().then(offer => {
                pc.setLocalDescription(offer);
                ws.send(JSON.stringify({ type: 'voice-offer', target: targetId, offer: offer }));
            });
        }
        return pc;
    }

    async function handleVoiceOffer(senderId, offer) {
        if (!isVoiceActive) return;
        const pc = createPeerConnection(senderId, false);
        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'voice-answer', target: senderId, answer: answer }));
    }

    async function handleVoiceAnswer(senderId, answer) {
        const pc = peerConnections[senderId];
        if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer));
    }

    async function handleVoiceIce(senderId, candidate) {
        const pc = peerConnections[senderId];
        if (pc && candidate) {
            try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e) {}
        }
    }

    // ==========================================

    function update() {
        if (!isGameReady || isPaused) return;

        if (keys['ArrowLeft']) { cameraStep = (cameraStep + 3) % 4; cameraAngle = cameraStep * (Math.PI / 2); keys['ArrowLeft'] = false; }
        if (keys['ArrowRight']) { cameraStep = (cameraStep + 1) % 4; cameraAngle = cameraStep * (Math.PI / 2); keys['ArrowRight'] = false; }

        let scrDx = 0, scrDy = 0;
        if (keys['KeyW']) scrDy -= 1;
        if (keys['KeyS']) scrDy += 1;
        if (keys['KeyA']) scrDx -= 1;
        if (keys['KeyD']) scrDx += 1;

        if (scrDx !== 0 || scrDy !== 0) {
            player.facing = Math.abs(scrDy) > Math.abs(scrDx) ? (scrDy < 0 ? 'up' : 'down') : (scrDx < 0 ? 'left' : 'right');
            
            let baseX = scrDx + scrDy;
            let baseY = -scrDx + scrDy;
            let cos = Math.cos(cameraAngle);
            let sin = Math.sin(cameraAngle);
            let worldDx = baseX * cos + baseY * sin;
            let worldDy = -baseX * sin + baseY * cos;

            const len = Math.hypot(worldDx, worldDy);
            const moveX = (worldDx / len) * player.speed;
            const moveY = (worldDy / len) * player.speed;

            const nextX = player.x + moveX;
            const nextY = player.y + moveY;
            let collision = false;
            for (let t of trees) { if (Math.hypot(nextX - t.x, nextY - t.y) < 0.7) collision = true; }

            if (!collision) {
                player.x = nextX; player.y = nextY; isMoving = true;
            } else isMoving = false;
        } else isMoving = false;
    }

    function draw() {
        globalTick += 0.2;
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const pIso = toIso(player.x, player.y);

        const pTileX = Math.round(player.x);
        const pTileY = Math.round(player.y);
        
        for (let dx = -20; dx <= 20; dx++) {
            for (let dy = -20; dy <= 20; dy++) {
                const x = pTileX + dx; const y = pTileY + dy;
                const s = toIso(x, y);
                const drawX = centerX + s.x - pIso.x; const drawY = centerY + s.y - pIso.y;
                if (drawX < -64 || drawX > canvas.width + 64 || drawY < -64 || drawY > canvas.height + 64) continue;

                ctx.beginPath();
                ctx.moveTo(drawX, drawY - TILE_HEIGHT/2); ctx.lineTo(drawX + TILE_WIDTH/2, drawY);
                ctx.lineTo(drawX, drawY + TILE_HEIGHT/2); ctx.lineTo(drawX - TILE_WIDTH/2, drawY);
                ctx.closePath();
                ctx.fillStyle = ((x + y) % 2 === 0) ? '#8FBC8F' : '#7CAA7C';
                ctx.fill(); ctx.strokeStyle = '#6B8E23'; ctx.stroke();
            }
        }

        const entities = [...trees, { x: player.x, y: player.y, type: 'player', data: { facing: player.facing, moving: isMoving }, isMe: true }];
        for (let id in otherPlayers) {
            entities.push({ x: otherPlayers[id].x, y: otherPlayers[id].y, type: 'player', data: otherPlayers[id], isMe: false });
        }
        entities.sort((a, b) => toIso(a.x, a.y).y - toIso(b.x, b.y).y);

        entities.forEach(e => {
            const s = toIso(e.x, e.y);
            const drawX = centerX + s.x - pIso.x; const drawY = centerY + s.y - pIso.y;
            if (e.type === 'player') drawCharacter(drawX, drawY, e.data, e.isMe);
            else drawTree(drawX, drawY);
        });
    }

    function drawTree(x, y) {
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(x, y, 20, 10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#8B4513'; ctx.fillRect(x - 10, y - 40, 20, 40);
        ctx.strokeStyle = '#000'; ctx.strokeRect(x - 10, y - 40, 20, 40);
        ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(x - 10, y - 40, 5, 40);
    }

    function drawCharacter(x, y, charData, isMe) {
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(x, y, 15, 8, 0, 0, Math.PI * 2); ctx.fill();
        const skin = isMe ? '#ffcc00' : '#3498db'; 
        const shirt = isMe ? '#ffcc00' : '#3498db';
        const pants = isMe ? '#3a6ea5' : '#2c3e50';
        const outline = '#000';
        const bobY = charData.moving ? Math.abs(Math.sin(globalTick)) * 2 : 0;
        const swing = charData.moving ? Math.sin(globalTick) * 4 : 0;
        ctx.lineWidth = 1;

        if (charData.facing === 'down' || charData.facing === 'up') {
            ctx.fillStyle = shirt; ctx.strokeStyle = outline;
            ctx.fillRect(x - 17, y - 25 + swing, 5, 15); ctx.strokeRect(x - 17, y - 25 + swing, 5, 15);
            ctx.fillRect(x + 12, y - 25 - swing, 5, 15); ctx.strokeRect(x + 12, y - 25 - swing, 5, 15);
            ctx.fillStyle = pants;
            ctx.fillRect(x - 8, y - 10 + swing, 7, 15); ctx.strokeRect(x - 8, y - 10 + swing, 7, 15);
            ctx.fillRect(x + 1, y - 10 - swing, 7, 15); ctx.strokeRect(x + 1, y - 10 - swing, 7, 15);
            ctx.fillStyle = shirt; ctx.fillRect(x - 12, y - 25 - bobY, 24, 15); ctx.strokeRect(x - 12, y - 25 - bobY, 24, 15);
            ctx.fillStyle = skin; ctx.fillRect(x - 10, y - 45 - bobY, 20, 20); ctx.strokeRect(x - 10, y - 45 - bobY, 20, 20);
            if (charData.facing === 'down') {
                ctx.fillStyle = '#000'; ctx.fillRect(x - 6, y - 38 - bobY, 4, 6); ctx.fillRect(x + 2, y - 38 - bobY, 4, 6); 
            } else {
                ctx.fillStyle = '#b38f00'; ctx.fillRect(x - 9, y - 44 - bobY, 18, 6);
            }
        } else {
            ctx.fillStyle = shirt; ctx.strokeStyle = outline;
            ctx.fillRect(x - 2, y - 25 + swing, 5, 15); ctx.strokeRect(x - 2, y - 25 + swing, 5, 15);
            ctx.fillStyle = pants;
            ctx.fillRect(x - 6, y - 10 - swing, 7, 15); ctx.strokeRect(x - 6, y - 10 - swing, 7, 15);
            ctx.fillRect(x + 2, y - 10 + swing, 7, 15); ctx.strokeRect(x + 2, y - 10 + swing, 7, 15);
            ctx.fillStyle = shirt; ctx.fillRect(x - 8, y - 25 - bobY, 16, 15); ctx.strokeRect(x - 8, y - 25 - bobY, 16, 15);
            ctx.fillStyle = skin; ctx.fillRect(x - 8, y - 45 - bobY, 16, 20); ctx.strokeRect(x - 8, y - 45 - bobY, 16, 20);
            ctx.fillStyle = '#000';
            if (charData.facing === 'right') { ctx.fillRect(x + 2, y - 38 - bobY, 4, 6); ctx.fillRect(x + 8, y - 34 - bobY, 2, 3); }
            else { ctx.fillRect(x - 6, y - 38 - bobY, 4, 6); ctx.fillRect(x - 10, y - 34 - bobY, 2, 3); }
        }
    }

    function togglePause() {
        if (!isGameReady) return;
        isPaused = !isPaused;
        pauseMenu.style.display = isPaused ? 'flex' : 'none';
    }

    function exitGame() {
        window.location.href = 'index.html';
    }

    function addChatMessage(text) {
        const div = document.createElement('div'); div.innerHTML = text;
        chatMessages.appendChild(div); chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    function sendMessage() {
        if (!isGameReady || chatInput.value.trim() === '') return;
        addChatMessage(`<b>[Ты]:</b> ${chatInput.value}`);
        chatInput.value = '';
    }
    document.getElementById('chat-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') sendMessage(); });

    function gameLoop() { 
        if (!isPaused) { update(); draw(); }
        requestAnimationFrame(gameLoop); 
    }
    gameLoop();
</script>
</body>
</html>
